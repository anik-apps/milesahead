name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_setup:
        description: 'Run full initial setup (systemd, config, caddy)'
        type: boolean
        default: false
      reseed_slugs:
        description: 'Comma-separated card slugs to FORCE-reseed (overwrites live prose). Leave empty for a normal deploy.'
        type: string
        default: ''
      reseed_structured:
        description: 'Also force-reseed structured comparison data for those slugs'
        type: boolean
        default: true

# Deploys share one target host and one staging path, so they must not overlap.
# Two merges minutes apart raced: each scp'd its binary to milesahead.new and
# each tried to mv it, so the second mv found nothing and failed. The binary
# that survived was whichever scp landed last, which is not necessarily the
# newer commit -- the pipeline could quietly install older code and report
# success. Queue instead of cancelling: a deploy that has already copied files
# to the server should be allowed to finish rather than be killed mid-swap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /opt/milesahead
  APP_USER: milesahead
  CADDY_SITES_DIR: /opt/fynans/caddy-sites

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build ARM64 binary
        run: GOOS=linux GOARCH=arm64 go build -o milesahead ./cmd/milesahead
      - name: Build seed binaries
        run: |
          GOOS=linux GOARCH=arm64 go build -o seed-cards ./cmd/seed-cards
          GOOS=linux GOARCH=arm64 go build -o seed-structured ./cmd/seed-structured
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: milesahead-arm64
          retention-days: 7
          path: |
            milesahead
            seed-cards
            cmd/seed-cards/cards.json
            seed-structured
            cmd/seed-structured/structured-data.json

  setup:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.full_setup == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Initial server setup
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          SSH="ssh $OCI_USER@$OCI_HOST"

          # Create app user and directories (ubuntu needs write access for deploys)
          $SSH "id -u ${{ env.APP_USER }} 2>/dev/null || sudo useradd -r -s /bin/false ${{ env.APP_USER }}"
          $SSH "sudo mkdir -p ${{ env.APP_DIR }}/data ${{ env.APP_DIR }}/templates ${{ env.APP_DIR }}/static"
          $SSH "sudo chown -R ubuntu:ubuntu ${{ env.APP_DIR }}"


          # Deploy systemd service (needs sudo for /etc/systemd)
          scp deploy/milesahead.service $OCI_USER@$OCI_HOST:/tmp/milesahead.service
          $SSH "sudo mv /tmp/milesahead.service /etc/systemd/system/milesahead.service && sudo systemctl daemon-reload && sudo systemctl enable milesahead"

          # Deploy Caddy config to shared sites directory
          $SSH "mkdir -p ${{ env.CADDY_SITES_DIR }}"
          scp deploy/milesahead.caddy $OCI_USER@$OCI_HOST:/tmp/milesahead.caddy
          $SSH "sudo cp /tmp/milesahead.caddy ${{ env.CADDY_SITES_DIR }}/milesahead.caddy"

          # Reload Caddy
          $SSH "docker exec fynans-caddy-1 caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || echo 'Caddy reload skipped — restart fynans stack to pick up new site'"

          # Install Grafana Alloy if not present
          $SSH "which alloy || (curl -fsSL https://apt.grafana.com/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/grafana.gpg && echo 'deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main' | sudo tee /etc/apt/sources.list.d/grafana.list && sudo apt-get update && sudo apt-get install -y alloy)"

          # Deploy Alloy config
          scp deploy/alloy-config.alloy $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/alloy-config.alloy

          # Deploy Alloy systemd service with Grafana credentials
          scp deploy/alloy.service $OCI_USER@$OCI_HOST:/tmp/alloy.service
          $SSH "sudo sed -i 's|Environment=GRAFANA_API_KEY=|Environment=GRAFANA_API_KEY=${{ secrets.GRAFANA_API_KEY }}|' /tmp/alloy.service"
          $SSH "sudo sed -i 's|Environment=GRAFANA_PROM_URL=|Environment=GRAFANA_PROM_URL=${{ secrets.GRAFANA_PROM_URL }}|' /tmp/alloy.service"
          $SSH "sudo sed -i 's|Environment=GRAFANA_PROM_USER=|Environment=GRAFANA_PROM_USER=${{ secrets.GRAFANA_PROM_USER }}|' /tmp/alloy.service"
          $SSH "sudo sed -i 's|Environment=GRAFANA_LOKI_URL=|Environment=GRAFANA_LOKI_URL=${{ secrets.GRAFANA_LOKI_URL }}|' /tmp/alloy.service"
          $SSH "sudo sed -i 's|Environment=GRAFANA_LOKI_USER=|Environment=GRAFANA_LOKI_USER=${{ secrets.GRAFANA_LOKI_USER }}|' /tmp/alloy.service"
          $SSH "sudo mv /tmp/alloy.service /etc/systemd/system/alloy.service && sudo systemctl daemon-reload && sudo systemctl enable alloy && sudo systemctl restart alloy"

  config:
    # Writes config.yaml on every deploy, and deploy depends on it so the
    # service restart always happens AFTER the new config is in place.
    #
    # This used to live in the `setup` job, gated on a manual
    # full_setup dispatch, so a normal push never updated config.yaml at
    # all -- model names changed in this repo silently did not reach
    # production. And because `setup` and `deploy` both only needed
    # `build`, they raced: `deploy` restarts milesahead while `setup`
    # writes the config, and nothing restarts it afterwards, so even the
    # manual path applied config only by luck of timing.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Write application config
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          SSH="ssh $OCI_USER@$OCI_HOST"

          # Deploy config file (via /tmp to avoid permission issues)
          cat > /tmp/config.yaml << CONFIGEOF
          server:
            port: 9090
            domain: milesahead.kumaranik.com

          admin:
            password_hash: "${ADMIN_PASSWORD_HASH}"

          db:
            path: /opt/milesahead/data/milesahead.db

          scanner:
            default_interval: 180
            cluster_threshold: 0.30
            user_agent: "MilesAhead/1.0"

          ai:
            # See config.example.yaml for why these models, and for the
            # warning that the provider catalogue lists models that do not work.
            generator_model: "nvidia/nemotron-3-ultra-550b-a55b"
            fallback_generator_model: "openai/gpt-oss-20b,nvidia/nemotron-3-super-120b-a12b"
            critic_model: "deepseek-ai/deepseek-v4.1-flash"
            vision_model: "meta/llama-3.2-11b-vision-instruct"
            request_timeout: 900
            enrichment_model: "openai/gpt-oss-20b,nvidia/nemotron-3-super-120b-a12b"
            enrichment_interval: 15
            enrichment_max_attempts: 3
            enrichment_max_duration: 10
            critic2_model: ""
            hf_api_token: "${NVIDIA_API_KEY}"
            hf_base_url: "https://integrate.api.nvidia.com/v1"
            critic_threshold: 75
            max_retries: 3
            cache_ttl: 3600
            unsplash_key: "${UNSPLASH_KEY}"
            pexels_key: "${PEXELS_KEY}"

          mail:
            smtp:
              host: localhost
              port: 587
              user: "placeholder"
              password: "placeholder"
              from: "noreply@milesahead.kumaranik.com"
            imap:
              host: localhost
              port: 993
              user: "placeholder"
              password: "placeholder"
              poll_interval: 120

          newsletter:
            send_time: "08:00"
            timezone: "America/New_York"

          votes:
            alert_threshold: 10
            alert_ratio: 0.4
            alert_window: 24
          CONFIGEOF

          scp /tmp/config.yaml $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/config.yaml
          $SSH "chmod 600 ${{ env.APP_DIR }}/config.yaml"

  deploy:
    needs: [build, config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: milesahead-arm64

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy binary and assets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          SSH="ssh $OCI_USER@$OCI_HOST"

          # Ensure app dir exists
          $SSH "sudo mkdir -p ${{ env.APP_DIR }} && sudo chown ubuntu:ubuntu ${{ env.APP_DIR }}"

          # Copy binary
          chmod +x milesahead
          scp milesahead $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/milesahead.new

          # Copy templates and static files
          scp -r templates $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/
          scp -r static $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/

          # Update Caddy config
          $SSH "mkdir -p ${{ env.CADDY_SITES_DIR }}"
          # Validate before installing. This file lands in a directory shared with
          # four other sites, and the reload previously swallowed its own errors --
          # so a syntax error would sit on disk undetected until the next container
          # restart, then take every site in that directory down with it.
          scp deploy/milesahead.caddy $OCI_USER@$OCI_HOST:/tmp/milesahead.caddy
          $SSH "docker cp /tmp/milesahead.caddy fynans-caddy-1:/tmp/milesahead.caddy"
          if ! $SSH "docker exec fynans-caddy-1 caddy validate --adapter caddyfile --config /tmp/milesahead.caddy"; then
            echo "::error title=Caddy config invalid::deploy/milesahead.caddy failed validation; not installing it."
            exit 1
          fi
          $SSH "sudo cp /tmp/milesahead.caddy ${{ env.CADDY_SITES_DIR }}/milesahead.caddy"
          if ! $SSH "docker exec fynans-caddy-1 caddy reload --config /etc/caddy/Caddyfile"; then
            echo "::error title=Caddy reload failed::Config is installed but not live. Check the shared Caddyfile before the container restarts."
            exit 1
          fi

          # Update Alloy config
          scp deploy/alloy-config.alloy $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/alloy-config.alloy
          # Observability is not worth failing a deploy over, but it is worth knowing about.
          $SSH "sudo systemctl restart alloy" || echo "::warning title=Alloy restart failed::Metrics/logs shipping may be down; deployment itself succeeded."

          # Install/refresh the DB backup script and its timer. Idempotent, and
          # placed in the deploy job (not setup) so it cannot drift uninstalled --
          # setup only runs on a manual full_setup dispatch.
          scp deploy/backup.sh $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/backup.sh
          $SSH "chmod +x ${{ env.APP_DIR }}/backup.sh"
          scp deploy/milesahead-backup.service deploy/milesahead-backup.timer $OCI_USER@$OCI_HOST:/tmp/
          $SSH "sudo mv /tmp/milesahead-backup.service /tmp/milesahead-backup.timer /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl enable --now milesahead-backup.timer"

          # Atomic swap and restart
          $SSH "mv ${{ env.APP_DIR }}/milesahead.new ${{ env.APP_DIR }}/milesahead && sudo systemctl restart milesahead"

          # Verify
          sleep 3
          $SSH "sudo systemctl is-active milesahead" || ($SSH "sudo journalctl -u milesahead -n 20 --no-pager" && exit 1)
          echo "Deploy successful!"

  seed:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: milesahead-arm64

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Seed reference data
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          SSH="ssh $OCI_USER@$OCI_HOST"

          # Copy seed binaries and data
          scp seed-cards $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/seed-cards
          scp cmd/seed-cards/cards.json $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/cards.json
          $SSH "chmod +x ${{ env.APP_DIR }}/seed-cards"

          scp seed-structured $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/seed-structured
          scp cmd/seed-structured/structured-data.json $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/structured-data.json
          $SSH "chmod +x ${{ env.APP_DIR }}/seed-structured"

          # Seed card reference pages (skips existing).
          $SSH "${{ env.APP_DIR }}/seed-cards -db ${{ env.APP_DIR }}/data/milesahead.db"

          # Corrections to a card already in the database are invisible to the
          # step above: it skips rows that exist, by design, so it never
          # clobbers live prose. Applying a fix therefore needs -force, and a
          # bare -force would rewrite every card -- 30 of 52 last time it was
          # measured. So corrections are dispatched explicitly, scoped to named
          # slugs, and they take a verified backup first.
          RESEED="${{ inputs.reseed_slugs }}"
          if [ -n "$RESEED" ]; then
            echo "::notice title=Scoped reseed::Force-reseeding: $RESEED"

            # VACUUM INTO, not cp: a plain copy of a WAL-mode database loses
            # whatever is still in the write-ahead log. That cost 25 rows once.
            $SSH "cd ${{ env.APP_DIR }} && ./backup.sh" \
              || { echo "::error title=Backup failed::Refusing to force-reseed without a verified backup."; exit 1; }

            $SSH "${{ env.APP_DIR }}/seed-cards -db ${{ env.APP_DIR }}/data/milesahead.db -force -slug '$RESEED'" \
              || { echo "::error title=Reseed failed::seed-cards -force did not complete."; exit 1; }

            if [ "${{ inputs.reseed_structured }}" = "true" ]; then
              $SSH "${{ env.APP_DIR }}/seed-structured -db ${{ env.APP_DIR }}/data/milesahead.db -force -slug '$RESEED'" \
                || { echo "::error title=Reseed failed::seed-structured -force did not complete."; exit 1; }
            fi

            echo "Force-reseeded: $RESEED" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Seed structured comparison data (skips cards that already have data)
          $SSH "${{ env.APP_DIR }}/seed-structured -db ${{ env.APP_DIR }}/data/milesahead.db"

          echo "Seeding complete!"

  grafana:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy Grafana dashboards
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_DS_UID: ${{ secrets.GRAFANA_DS_UID }}
        run: |
          SKIPPED=0
          if [ -n "$GRAFANA_URL" ] && [ -n "$GRAFANA_API_KEY" ]; then
            for DASH in deploy/grafana-dashboard-*.json; do
              DASH_NAME=$(basename "$DASH" .json)
              sed "s/DS_PLACEHOLDER/${GRAFANA_DS_UID:-grafanacloud-prom}/g" "$DASH" > "/tmp/$DASH_NAME.json"
              HTTP_CODE=$(curl -sS -o /tmp/dash-response.json -w "%{http_code}" -X POST "$GRAFANA_URL/api/dashboards/db" \
                -H "Authorization: Bearer $GRAFANA_API_KEY" \
                -H "Content-Type: application/json" \
                -d @"/tmp/$DASH_NAME.json")
              if [ "$HTTP_CODE" -ne 200 ]; then
                # Grafana Cloud suspends free-tier instances after inactivity and
                # answers 503 with {"code":"Loading"} until someone wakes it in the
                # UI. That is not a deployment failure -- the app has already
                # shipped by this point -- and failing here trains us to ignore red
                # deploys. Warn and move on; every other failure still exits 1.
                if [ "$HTTP_CODE" -eq 503 ] && grep -q '"code":"Loading"' /tmp/dash-response.json; then
                  echo "::warning title=Grafana dashboards not updated::Instance is hibernating or still waking (HTTP 503). Dashboards are unchanged; wake it in the Grafana UI and re-run this job."
                  cat /tmp/dash-response.json
                  SKIPPED=1
                  continue
                fi
                echo "Dashboard deploy failed for $DASH_NAME (HTTP $HTTP_CODE):"
                cat /tmp/dash-response.json
                exit 1
              fi
              echo "Deployed $DASH_NAME"
            done
          else
            echo "Skipping dashboard deploy — secrets not set"
          fi
          if [ "$SKIPPED" -eq 1 ]; then
            echo "Dashboards skipped: Grafana instance unavailable. Deployment itself succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Grafana alert rules
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_DS_UID: ${{ secrets.GRAFANA_DS_UID }}
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_API_KEY" ]; then
            echo "Skipping alert deploy — secrets not set"
            exit 0
          fi

          # Rules carry stable UIDs, so PUT updates in place and POST only runs
          # the first time. Without that, every deploy would create a duplicate
          # rule and the alert would fire N times per incident.
          python3 -c "
          import json, os, sys
          rules = json.load(open('deploy/grafana-alerts.json'))
          ds = os.environ.get('GRAFANA_DS_UID') or 'grafanacloud-prom'
          for r in rules:
              body = json.dumps(r).replace('DS_PLACEHOLDER', ds)
              open('/tmp/alert-' + r['uid'] + '.json', 'w').write(body)
              print(r['uid'])
          " > /tmp/alert-uids.txt

          FAILED=0
          while read -r RULE_UID; do
            [ -z "$RULE_UID" ] && continue
            # X-Disable-Provenance keeps the rules editable in the Grafana UI;
            # without it provisioned rules are read-only and cannot be silenced
            # or tuned during an incident.
            CODE=$(curl -sS -o /tmp/alert-resp.json -w "%{http_code}"               -X PUT "$GRAFANA_URL/api/v1/provisioning/alert-rules/$RULE_UID"               -H "Authorization: Bearer $GRAFANA_API_KEY"               -H "Content-Type: application/json"               -H "X-Disable-Provenance: true"               -d @"/tmp/alert-$RULE_UID.json")

            if [ "$CODE" = "404" ]; then
              CODE=$(curl -sS -o /tmp/alert-resp.json -w "%{http_code}"                 -X POST "$GRAFANA_URL/api/v1/provisioning/alert-rules"                 -H "Authorization: Bearer $GRAFANA_API_KEY"                 -H "Content-Type: application/json"                 -H "X-Disable-Provenance: true"                 -d @"/tmp/alert-$RULE_UID.json")
            fi

            case "$CODE" in
              200|201|202)
                echo "Deployed alert rule $RULE_UID"
                ;;
              503)
                # Same hibernating-instance case the dashboard step tolerates.
                echo "::warning title=Alert rule not updated::$RULE_UID skipped, Grafana returned 503 (instance hibernating). Wake it and re-run."
                ;;
              *)
                echo "Alert rule $RULE_UID failed (HTTP $CODE):"
                cat /tmp/alert-resp.json
                FAILED=1
                ;;
            esac
          done < /tmp/alert-uids.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "::error title=Alert rules not deployed::The generation-drought alert is the control that catches a silent content outage. Fix before relying on it."
            exit 1
          fi
