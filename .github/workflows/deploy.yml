name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_setup:
        description: 'Run full initial setup (systemd, config, caddy)'
        type: boolean
        default: false

env:
  APP_DIR: /opt/milesahead
  APP_USER: milesahead
  CADDY_SITES_DIR: /home/ubuntu/actions-runner/_work/fyNaNs/fyNaNs/caddy-sites

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ARM64 binary
        run: GOOS=linux GOARCH=arm64 go build -o milesahead ./cmd/milesahead
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: milesahead-arm64
          path: milesahead

  setup:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.full_setup == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Initial server setup
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          SSH="ssh $OCI_USER@$OCI_HOST"

          # Create app user and directories
          $SSH "id -u ${{ env.APP_USER }} 2>/dev/null || sudo useradd -r -s /bin/false ${{ env.APP_USER }}"
          $SSH "sudo mkdir -p ${{ env.APP_DIR }}/data && sudo chown -R ${{ env.APP_USER }}:${{ env.APP_USER }} ${{ env.APP_DIR }}"

          # Deploy config file
          cat > /tmp/config.yaml << CONFIGEOF
          server:
            port: 9090
            domain: milesahead.kumaranik.com

          admin:
            password_hash: "${ADMIN_PASSWORD_HASH}"

          db:
            path: /opt/milesahead/data/milesahead.db

          scanner:
            default_interval: 180
            user_agent: "MilesAhead/1.0"

          ai:
            generator_model: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
            critic_model: "meta/llama-3.3-70b-instruct"
            critic2_model: ""
            hf_api_token: "${NVIDIA_API_KEY}"
            hf_base_url: "https://integrate.api.nvidia.com/v1"
            critic_threshold: 75
            max_retries: 3
            cache_ttl: 3600

          mail:
            smtp:
              host: localhost
              port: 587
              user: "placeholder"
              password: "placeholder"
              from: "noreply@milesahead.kumaranik.com"
            imap:
              host: localhost
              port: 993
              user: "placeholder"
              password: "placeholder"
              poll_interval: 120

          newsletter:
            send_time: "08:00"
            timezone: "America/New_York"

          votes:
            alert_threshold: 10
            alert_ratio: 0.4
            alert_window: 24
          CONFIGEOF

          scp /tmp/config.yaml $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/config.yaml
          $SSH "sudo chown ${{ env.APP_USER }}:${{ env.APP_USER }} ${{ env.APP_DIR }}/config.yaml && sudo chmod 600 ${{ env.APP_DIR }}/config.yaml"

          # Deploy systemd service
          scp deploy/milesahead.service $OCI_USER@$OCI_HOST:/tmp/milesahead.service
          $SSH "sudo mv /tmp/milesahead.service /etc/systemd/system/milesahead.service && sudo systemctl daemon-reload && sudo systemctl enable milesahead"

          # Deploy Caddy config to shared sites directory
          $SSH "mkdir -p ${{ env.CADDY_SITES_DIR }}"
          scp deploy/milesahead.caddy $OCI_USER@$OCI_HOST:${{ env.CADDY_SITES_DIR }}/milesahead.caddy

          # Reload Caddy to pick up the new site
          $SSH "docker exec fynans-caddy-1 caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || echo 'Caddy reload skipped - restart the fynans stack to pick up the new site'"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: milesahead-arm64

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy binary and assets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          SSH="ssh $OCI_USER@$OCI_HOST"

          # Copy binary
          chmod +x milesahead
          scp milesahead $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/milesahead.new

          # Copy templates and static files
          scp -r templates $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/
          scp -r static $OCI_USER@$OCI_HOST:${{ env.APP_DIR }}/

          # Update Caddy config if changed
          scp deploy/milesahead.caddy $OCI_USER@$OCI_HOST:${{ env.CADDY_SITES_DIR }}/milesahead.caddy
          $SSH "docker exec fynans-caddy-1 caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true"

          # Atomic swap and restart
          $SSH "sudo mv ${{ env.APP_DIR }}/milesahead.new ${{ env.APP_DIR }}/milesahead && sudo chown ${{ env.APP_USER }}:${{ env.APP_USER }} ${{ env.APP_DIR }}/milesahead && sudo systemctl restart milesahead"

          # Verify it started
          sleep 3
          $SSH "sudo systemctl is-active milesahead" || ($SSH "sudo journalctl -u milesahead -n 20 --no-pager" && exit 1)
          echo "Deployment successful!"
