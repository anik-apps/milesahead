{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}Miles Ahead</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
</head>
<body>
    <nav>
        <a href="/" class="logo">Miles Ahead</a>
        <div class="nav-links">
            <a href="/cards/">Cards</a>
            <div class="nav-search">
                <button id="search-toggle" type="button" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <form action="/search" method="GET" class="nav-search-form" id="nav-search-form">
                    <input type="text" name="q" placeholder="Search..." aria-label="Search">
                </form>
            </div>
            <button id="theme-toggle" type="button">Toggle Theme</button>
        </div>
    </nav>
    <main>
        {{template "content" .}}
    </main>
    <footer>
        <p>&copy; 2026 Miles Ahead &middot; <a href="/feed.xml">RSS Feed</a></p>
    </footer>
    <script src="/static/js/main.js"></script>
</body>
</html>{{end}}
{{define "csrf_field"}}<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{end}}
