{{/* The admin navigation, one copy for every admin page. Called with the
     active tab's name: {{template "admin_nav" "cards"}}. */}}
{{define "admin_nav"}}
<nav class="admin-nav" aria-label="Admin">
    <a href="/admin/dashboard"{{if eq . "pending"}} class="active" aria-current="page"{{end}}>Pending</a>
    <a href="/admin/published"{{if eq . "published"}} class="active" aria-current="page"{{end}}>Published</a>
    <a href="/admin/sources"{{if eq . "sources"}} class="active" aria-current="page"{{end}}>Sources</a>
    <a href="/admin/subscribers"{{if eq . "subscribers"}} class="active" aria-current="page"{{end}}>Subscribers</a>
    <a href="/admin/cards"{{if eq . "cards"}} class="active" aria-current="page"{{end}}>Cards</a>
    <a href="/admin/newsletter"{{if eq . "newsletter"}} class="active" aria-current="page"{{end}}>Newsletter</a>
    <a href="/admin/settings"{{if eq . "settings"}} class="active" aria-current="page"{{end}}>Settings</a>
    <form method="POST" action="/admin/logout" class="logout-btn">
        <button type="submit" class="logout-link">Log out</button>
    </form>
</nav>
{{end}}
