server:
  port: 8080
  domain: milesahead.kumaranik.com

admin:
  password_hash: "$2a$12$..."  # bcrypt

db:
  path: /opt/milesahead/data/milesahead.db

scanner:
  default_interval: 180  # minutes
  # Minimum title similarity for two scanned articles to be treated as the
  # same story. Was effectively 0.5, which split one announcement across
  # several clusters and published it twice. 0 uses cluster.DefaultThreshold.
  cluster_threshold: 0.30
  user_agent: "MilesAhead/1.0"

ai:
  # Primary generator. Re-selected 2026-09-21 after the previous primary
  # (openai/gpt-oss-120b), its fallback and the critic were ALL retired upstream,
  # stopping publication for 26 days. Verify any change here with cmd/ab-models:
  # the provider's own /v1/models catalogue is not a liveness signal -- of 81
  # models listed, 49 looked chat-capable and only 9 answered.
  #
  # nemotron-3-ultra-550b-a55b scored 95 on 4 of 5 real clusters (threshold 75).
  # Slower than the old primary: 105-510s per article versus ~10s.
  generator_model: "nvidia/nemotron-3-ultra-550b-a55b"
  # Fallback chain, comma-separated, tried left to right on a retryable error
  # (429 / 5xx / timeout) OR a permanently gone model (404 / 410). Leave empty
  # to disable. gpt-oss-20b is the only other model that both generates and
  # honours the critic JSON contract.
  # Kept deliberately more than one deep: the outage happened because the
  # primary AND the single configured fallback were retired in the same window.
  # gpt-oss-20b is verified to generate and to honour the critic contract;
  # nemotron-3-super-120b-a12b is a last resort only -- it answers quickly but
  # returns 503 intermittently and leaks reasoning preamble, so it is placed
  # after a model that does neither.
  fallback_generator_model: "openai/gpt-oss-20b,nvidia/nemotron-3-super-120b-a12b"
  # Critic must return parseable JSON: Critic.Verify runs replies through
  # extractJSON, so reasoning-style models that answer in prose disqualify
  # themselves regardless of judgement quality (glm-5.3-flash failed 3 of 4).
  #
  # Re-selected 2026-09-29. The previous critic, mistralai/mistral-nemotron,
  # was retired upstream on 2026-09-28 08:00 UTC (410 "end of life" on every
  # call), so nothing passed verification and nothing published. Measured with
  # cmd/ab-models -critic-candidates on a real article from the production
  # generator:
  #   deepseek-ai/deepseek-v4.1-flash     86 and 88 on two runs, valid JSON,
  #                                       all 4 checks true, 116s / 260s
  #   openai/gpt-oss-20b                  60, 16s
  #   nvidia/nemotron-3-super-120b-a12b   45, 100s, truncation retries
  #   moonshotai/kimi-k3                  42
  #   google/gemma-4-31b-it               40, 1167s
  #   z-ai/glm-5.3                        truncated / timed out
  # Listed by the provider but 404 when called: mistral-large,
  # mistral-large-2-instruct, kimi-k2.6, llama-3.1-nemotron-70b-instruct,
  # llama-3.1-nemotron-ultra-253b-v1, palmyra-fin-70b-32k.
  #
  # deepseek is slow -- minutes per reply, including 4m56s to answer a
  # one-word preflight probe -- which is fine inside request_timeout (900s)
  # for verification, but it must not be used for anything else: short calls
  # are capped at 30s (ai.ShortCallTimeout) and would time out every time.
  # Those run on enrichment_model instead.
  #
  # Deliberately a different model from the generator: self-grading is not a
  # quality gate. On a reference article the retired critic scored 92, the
  # 550b 82 and gpt-oss-20b 45; deepseek scores in the high 80s, so the
  # publish bar moves again -- watch the approval rate after changing it.
  critic_model: "deepseek-ai/deepseek-v4.1-flash"
  # Vision model for image scoring. The 90b variant this replaced times out on
  # every call, so each candidate image burned the full 300s client timeout.
  vision_model: "meta/llama-3.2-11b-vision-instruct"
  # Seconds per model call. The primary takes 105-510s per article, so the
  # previous hardcoded 300s could have timed out a healthy-but-slow generation
  # and silently demoted it to the fallback.
  request_timeout: 900
  # The chain for every short AI call: enrichment (Scout's Take, key details,
  # tags, image queries -- a background reconciliation pass, not inline in
  # article creation), image text-scoring, the newsletter pick, card-update
  # detection and the pipeline's inline key-details call. Comma-separated,
  # tried in order on a retryable error or a retired model. These calls are
  # capped at 30s, so only fast models belong here.
  #
  # Deliberately not critic_model: the side jobs used to reuse it, so the
  # critic's retirement on 2026-09-28 took them all down with it, and the new
  # critic is far too slow for a 30s call. Enrichment itself survived only
  # because this was already a chain -- kept two deep for the same reason as
  # fallback_generator_model.
  #
  # Checked 2026-09-29 on short real prompts (tags, image scoring, card-update
  # detection, Scout's Take): gpt-oss-20b 3-11s, all valid; nemotron-3-super
  # 2-11s, all valid, and its Scout's Take was clean prose with no reasoning
  # preamble. It is second because it returns 503 intermittently. Rejected:
  # gemma-4-31b-it (30s timeout on tags), deepseek-v4.1-flash (minutes).
  enrichment_model: "openai/gpt-oss-20b,nvidia/nemotron-3-super-120b-a12b"
  enrichment_interval: 15        # minutes
  enrichment_max_attempts: 3     # passes before an article is left alone
  # Bounds one pass. A pass has no limit of its own otherwise, and on a
  # degraded provider it can outlast its interval many times over — at which
  # point every later tick is skipped and the reconciler looks idle rather
  # than stuck. Checked between articles, so the real ceiling is this plus
  # one article's worst case.
  enrichment_max_duration: 10    # minutes
  hf_api_token: "${HF_API_TOKEN}"
  critic_threshold: 70
  max_retries: 3
  cache_ttl: 3600  # seconds

mail:
  smtp:
    host: smtp.email.oci.oraclecloud.com
    port: 587
    user: "${SMTP_USER}"
    password: "${SMTP_PASSWORD}"
    from: "noreply@milesahead.kumaranik.com"
  imap:
    host: imap.gmail.com
    port: 993
    user: "${IMAP_USER}"
    password: "${IMAP_APP_PASSWORD}"
    poll_interval: 120  # seconds

newsletter:
  send_time: "08:00"
  # The newsletter schedule's timezone. Defaults to UTC when empty. Offer end
  # dates do not use it: "Deadline: July 29, 2026" counts as ended once July
  # 29 is over in Hawaii, the westernmost US zone, on the site and in the
  # newsletter alike.
  timezone: "America/New_York"

votes:
  alert_threshold: 10
  alert_ratio: 0.4
  alert_window: 24

site:
  persona_name: "Scout"
