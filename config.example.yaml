server:
  port: 8080
  domain: milesahead.kumaranik.com

admin:
  password_hash: "$2a$12$..."  # bcrypt

db:
  path: /opt/milesahead/data/milesahead.db

scanner:
  default_interval: 180  # minutes
  user_agent: "MilesAhead/1.0"

ai:
  # Primary generator. Empirical A/B testing across 80 article generations
  # (4 candidate models on integrate.api.nvidia.com) showed openai/gpt-oss-120b
  # had the highest publish-ready rate (90% scoring >=75 from the critic) and
  # ~10s latency.
  generator_model: "openai/gpt-oss-120b"
  # Fallback used when the primary returns a retryable error (HTTP 429 / 5xx /
  # timeout). Qwen 3.5 was the second-best in the same A/B test (85% pass rate)
  # and has not exhibited the rate-limit issues that disqualified DeepSeek.
  # Leave empty to disable fallback.
  fallback_generator_model: "qwen/qwen3.5-122b-a10b"
  critic_model: "meta/llama-3.3-70b-instruct"
  hf_api_token: "${HF_API_TOKEN}"
  critic_threshold: 70
  max_retries: 3
  cache_ttl: 3600  # seconds

mail:
  smtp:
    host: smtp.email.oci.oraclecloud.com
    port: 587
    user: "${SMTP_USER}"
    password: "${SMTP_PASSWORD}"
    from: "noreply@milesahead.kumaranik.com"
  imap:
    host: imap.gmail.com
    port: 993
    user: "${IMAP_USER}"
    password: "${IMAP_APP_PASSWORD}"
    poll_interval: 120  # seconds

newsletter:
  send_time: "08:00"
  timezone: "America/New_York"

votes:
  alert_threshold: 10
  alert_ratio: 0.4
  alert_window: 24

site:
  persona_name: "Scout"
