server:
  port: 8080
  domain: milesahead.kumaranik.com

admin:
  password_hash: "$2a$12$..."  # bcrypt

db:
  path: /opt/milesahead/data/milesahead.db

scanner:
  default_interval: 180  # minutes
  # Minimum title similarity for two scanned articles to be treated as the
  # same story. Was effectively 0.5, which split one announcement across
  # several clusters and published it twice. 0 uses cluster.DefaultThreshold.
  cluster_threshold: 0.30
  user_agent: "MilesAhead/1.0"
  # Story-level duplicate check, run on each cluster that passes the raw-ID
  # check, before generation: "shadow" | "block" | "off". Unset means shadow.
  #
  # 16 of 98 articles generated 2026-09-21..30 repeated a story already
  # written, and no pair shared a source article, so the raw-ID check could
  # not see them. The check compares the cluster with every article generated
  # in the last 7 days (any status, including rejected and drafts). A TF-IDF
  # prefilter on titles keeps the top 5 scoring >= 0.25; if any pass, one
  # short call on the enrichment_model chain decides whether it is the same
  # story and, if so, whether it is a materially new development (a
  # follow-up, which is generated). If that call fails, the lexical score
  # decides alone at >= 0.55.
  #
  # Lexical score alone, measured on those 98 articles (16 duplicates):
  #   >= 0.25   16/16 duplicates caught, 24 of 79 legitimate flagged
  #   >= 0.35   15/16,  9 flagged
  #   >= 0.45    9/16,  4 flagged
  #   >= 0.55    7/16,  2 flagged
  # which is why the AI makes the call. shadow logs every decision ("story
  # dedup decision", with would_block, the cluster's raw IDs and the matched
  # article) and counts milesahead_story_dedup_decisions_total, but still
  # generates. block skips a duplicate and records its sources as covered by
  # the matched article. Review the shadow decisions against what was
  # approved and rejected before switching to block.
  story_dedup: "shadow"

ai:
  # Primary generator. Re-selected 2026-09-21 after the previous primary
  # (openai/gpt-oss-120b), its fallback and the critic were ALL retired upstream,
  # stopping publication for 26 days. Verify any change here with cmd/ab-models:
  # the provider's own /v1/models catalogue is not a liveness signal -- of 81
  # models listed, 49 looked chat-capable and only 9 answered.
  #
  # nemotron-3-ultra-550b-a55b scored 95 on 4 of 5 real clusters (threshold 75).
  # Slower than the old primary: 105-510s per article versus ~10s.
  generator_model: "nvidia/nemotron-3-ultra-550b-a55b"
  # Fallback chain, comma-separated, tried left to right on a retryable error
  # (429 / 5xx / timeout) OR a permanently gone model (404 / 410). Leave empty
  # to disable. gpt-oss-20b is the only other model that both generates and
  # honours the critic JSON contract.
  # Kept deliberately more than one deep: the outage happened because the
  # primary AND the single configured fallback were retired in the same window.
  # gpt-oss-20b is verified to generate and to honour the critic contract.
  # The last resort was nemotron-3-super-120b-a12b, retired 2026-10-20 (404);
  # its successor nemotron-3.5-super-vl-120b-a12b takes the place. It answers
  # short prompts with thinking on in 1-2s (checked 2026-10-22) but has not
  # been measured as a generator, so it stays behind gpt-oss-20b.
  fallback_generator_model: "openai/gpt-oss-20b,nvidia/nemotron-3.5-super-vl-120b-a12b"
  # Critic: a comma-separated chain, tried left to right on the same errors as
  # the generator fallbacks (429 / 5xx / timeout / 404 / 410). One reachable
  # critic is enough to publish. It must return parseable JSON: Critic.Verify
  # runs replies through extractJSON, so models that answer in prose
  # disqualify themselves regardless of judgement quality.
  #
  # Re-selected 2026-10-22. Both critics of the previous chain were retired
  # upstream: moonshotai/kimi-k3 (410, end of life 2026-10-15) and
  # nvidia/nemotron-3-super-120b-a12b (404 from 2026-10-20). With no critic
  # left, every article was generated and then dropped, and production
  # published nothing for 2.5 days. A critic ERROR drops the article from the
  # scan outright. (A score below critic_threshold is different: the article
  # is saved as a draft, not lost -- see article.Manager.CreateFromPipeline.)
  #
  # Measured with `ab-models -critic-candidates`: every candidate graded the
  # same 5 real articles from the production generator, thinking OFF, score
  # after the pipeline's adjustScore, threshold 75:
  #   critic                                  valid JSON  avg  >=75   avg time
  #   nemotron-3.5-super-vl-120b-a12b         5/5         71   3/5    ~2s
  #   nemotron-3.5-lightning-30b-a3b          4/5         78   3/5    ~3s
  #   deepseek-v4.1-flash                     5/5         53   0/5    22s
  #   z-ai/glm-5.3-flash                      ran out of tokens thinking, 3 tries
  #   z-ai/glm-5.3                            timed out on every try
  # super-vl, nemotron-3-super's successor, leads: it always returned valid
  # JSON and failed the one weak article the others disagreed on. lightning is
  # more lenient (85 where the others gave 18-22) and once returned JSON that
  # would not parse -- a reply that won't parse drops the article rather than
  # moving to the next critic, so it is the backup, not the lead. deepseek has
  # been too strict and too slow since 2026-09-29 (gateway 504s after ~5 min).
  #
  # Thinking off (critic_disable_thinking below) is how every critic score
  # here was measured; nemotron-3-super with thinking on leaked its reasoning
  # into the JSON and scored 45.
  #
  # Independence caveat: super-vl is the same family as the generator (not
  # the same model), and it is also in fallback_generator_model -- when the
  # generator falls back to it, the article is graded by the model that wrote
  # it. Self-grading is not a quality gate; watch the approval rate.
  critic_model: "nvidia/nemotron-3.5-super-vl-120b-a12b,nvidia/nemotron-3.5-lightning-30b-a3b"
  # Sends chat_template_kwargs {"enable_thinking": false} on critic requests
  # (critic_model and critic2_model) only; generation, enrichment, side jobs
  # and vision keep the model's default. Every critic measurement above that
  # says "thinking OFF" was made with this. Default false.
  critic_disable_thinking: true
  # Vision model for image scoring. The 90b variant this replaced times out on
  # every call, so each candidate image burned the full 300s client timeout.
  vision_model: "meta/llama-3.2-11b-vision-instruct"
  # Seconds per model call. The primary takes 105-510s per article, so the
  # previous hardcoded 300s could have timed out a healthy-but-slow generation
  # and silently demoted it to the fallback.
  request_timeout: 900
  # The chain for every short AI call: enrichment (Scout's Take, key details,
  # tags, image queries -- a background reconciliation pass, not inline in
  # article creation), image text-scoring, the newsletter pick, card-update
  # detection and the pipeline's inline key-details call. Comma-separated,
  # tried in order on a retryable error or a retired model. These calls are
  # capped at 30s (card-update detection at 120s, as its reply is a whole card
  # section), so only fast models belong here.
  #
  # Deliberately not led by the critic: the side jobs used to reuse it, so the
  # critic's retirement on 2026-09-28 took them all down with it. Enrichment
  # itself survived only because this was already a chain -- kept two deep for
  # the same reason as fallback_generator_model. The first critic is in both
  # chains, but first in only one of them, so an overloaded critic backend
  # costs enrichment a fallback, not its primary.
  #
  # Checked 2026-09-29 on short real prompts (tags, image scoring, card-update
  # detection, Scout's Take): gpt-oss-20b 3-11s, all valid; nemotron-3-super
  # 2-11s, all valid, and its Scout's Take was clean prose with no reasoning
  # preamble. Rejected: gemma-4-31b-it (30s timeout on tags),
  # deepseek-v4.1-flash (minutes). nemotron-3-super was retired 2026-10-20;
  # its successor nemotron-3.5-super-vl-120b-a12b takes its place as the
  # second model, after a 512-token check with thinking on (1-2s, clean JSON,
  # 2026-10-22). Not yet measured on the real short prompts.
  enrichment_model: "openai/gpt-oss-20b,nvidia/nemotron-3.5-super-vl-120b-a12b"
  enrichment_interval: 15        # minutes
  enrichment_max_attempts: 3     # passes before an article is left alone
  # Bounds one pass. A pass has no limit of its own otherwise, and on a
  # degraded provider it can outlast its interval many times over — at which
  # point every later tick is skipped and the reconciler looks idle rather
  # than stuck. Checked between articles, so the real ceiling is this plus
  # one article's worst case.
  enrichment_max_duration: 10    # minutes
  # Article infographics: an "At a glance" chart of each article's key
  # details, under Key Details. The infographic_model chain below picks the
  # numbers (one more call per article, bounded at 120s per model in the
  # chain -- up to 240s with two -- with no retries); the site draws them. A
  # chart that fails a check (bars in two units, a number the article does
  # not state, a news site named) goes to the next model.
  #   off      draw nothing; article pages show nothing (the default)
  #   preview  draw them; show them only in the admin (review preview and
  #            Published), where they can be removed or redrawn
  #   on       draw them and show them on article pages
  # The admin shows charts already stored in every mode.
  # preview or on makes every article without a chart eligible for the next
  # passes, ten at a time, until the archive is drawn or each article's
  # attempts run out. Going back to off takes the charts off article pages
  # and stops drawing; nothing is deleted.
  enrichment_infographics: "on"
  # The chain charts are drawn with; empty uses enrichment_model. Reversed
  # from enrichment_model: drawing charts for ten real articles on
  # 2026-10-05, gpt-oss-20b timed out at 120s on 4 of 10 and took 46-70s
  # otherwise; nemotron-3-super answered all four calls that reached it, in
  # 22-46s.
  # The charts were of similar quality; the 503s that put nemotron-3-super
  # second in enrichment_model fall through to gpt-oss-20b here.
  # nemotron-3-super was retired 2026-10-20 and every chart has fallen through
  # to gpt-oss-20b since. Its successor nemotron-3.5-super-vl-120b-a12b leads
  # now, unmeasured on charts; a chart it gets wrong goes to gpt-oss-20b.
  infographic_model: "nvidia/nemotron-3.5-super-vl-120b-a12b,openai/gpt-oss-20b"
  hf_api_token: "${HF_API_TOKEN}"
  critic_threshold: 70
  max_retries: 3
  cache_ttl: 3600  # seconds
  # Model health: every model in every list is checked this often, and each
  # real call's outcome is recorded; the admin Models tab shows the result.
  # Minutes; absent or 0 = 60; a negative value turns the hourly check off
  # (one check still runs at boot).
  health_check_interval: 60
  # Where model-health alerts are emailed: a model dying, a list running on a
  # backup or with nothing left, publishing stopped. Empty uses
  # votes.alert_email; with neither, alerts are only shown in the admin.
  alert_email: ""

mail:
  smtp:
    host: smtp.email.oci.oraclecloud.com
    port: 587
    user: "${SMTP_USER}"
    password: "${SMTP_PASSWORD}"
    from: "noreply@milesahead.kumaranik.com"
  imap:
    host: imap.gmail.com
    port: 993
    user: "${IMAP_USER}"
    password: "${IMAP_APP_PASSWORD}"
    poll_interval: 120  # seconds

newsletter:
  # When the weekly issue goes out: send_day (a weekday name or its first
  # three letters), send_time (24-hour HH:MM) and timezone (an IANA name),
  # by default saturday, 08:00 and America/New_York. The issue is built at
  # 20:00 the day before. The sign-up page, the confirmation email and the
  # admin newsletter page say the same ("every Saturday at 8:00 AM ET").
  # A value that cannot be read fails the config check.
  send_day: "saturday"
  send_time: "08:00"
  # Also dates the issues and decides which day counts as "today" on the
  # admin newsletter page. Offer end dates do not use it: "Deadline: July
  # 29, 2026" counts as ended once July 29 is over in Hawaii, the westernmost
  # US zone, on the site and in the newsletter alike.
  timezone: "America/New_York"
  # Opens newsletter sign-up: the Newsletter link in the header and footer,
  # the line in the home hero, the box at the end of every article, the
  # /subscribe form and the confirmation email. Off, /subscribe says sign-up
  # opens soon and stores nothing. Turn it on only once mail.smtp points at a
  # working relay: with it on and SMTP looking unset (no host or From,
  # localhost, or placeholder credentials) the app logs an ERROR at startup
  # and keeps sign-up closed. Checklist in ROADMAP.md (Newsletter).
  signup_enabled: false
  # A mailbox someone reads and acts on, added to every newsletter's
  # List-Unsubscribe header as a mailto. Leave empty unless one exists: the
  # one-click https link is what Gmail and Yahoo require, and a mailto to an
  # unread address leaves readers thinking they unsubscribed when they did not.
  unsubscribe_mailbox: ""

votes:
  # An article alerts when, among the votes cast in the last alert_window
  # hours (0: all of its votes), at least alert_threshold are downvotes and
  # they make up at least alert_ratio of them.
  alert_threshold: 10
  alert_ratio: 0.4
  alert_window: 24
  # Every alert is listed on the admin Published page (with a count on its
  # tab) until acknowledged. Set this to a mailbox you read to also get each
  # one by email; empty (the default), none is emailed. Alerts never go to
  # mail.smtp.from, which nobody reads. The deploy sets it from the
  # ALERT_EMAIL secret. OCI Email Delivery adds its own List-Unsubscribe to
  # these emails: do not click Unsubscribe on them, or OCI suppresses this
  # address and no alert reaches it again.
  alert_email: ""

site:
  persona_name: "Scout"
